# ELHABAK production Nginx site.
# Install to /etc/nginx/sites-available/elhabak and enable from sites-enabled.
# Requires scripts/deploy/nginx/elhabak-observability.conf in /etc/nginx/conf.d.

map $http_upgrade $elhabak_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name elhabak.com www.elhabak.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://elhabak.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;

    server_name elhabak.com;

    ssl_certificate     /etc/letsencrypt/live/elhabak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elhabak.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:elhabak_ssl:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    access_log /var/log/nginx/elhabak.access.log elhabak_timed;
    client_max_body_size 30m;
    client_body_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $elhabak_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $elhabak_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;

    server_name www.elhabak.com;

    ssl_certificate     /etc/letsencrypt/live/elhabak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elhabak.com/privkey.pem;

    return 301 https://elhabak.com$request_uri;
}
